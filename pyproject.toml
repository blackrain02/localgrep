[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localgrep"
version = "0.3.2"
description = "Fast, index-free local semantic search, AST context pruning, skill recommender & MCP server for AI coding agents."
readme = "README.md"
authors = [
  { name = "Javad", email = "javad@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing"
]
keywords = ["code-search", "semantic-search", "ripgrep", "ai-agents", "context-pruning", "llm-tokens", "mcp", "tree-sitter", "onnx"]
requires-python = ">=3.9"
dependencies = [
    "transformers>=4.30.0",
    "onnxruntime>=1.16.0",
    "tree-sitter>=0.21.0,<0.22",
    "tree-sitter-languages>=1.10.0",
    "mcp>=2.0.0"
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
all = ["torch>=2.0.0"]

[project.scripts]
lg = "localgrep.cli:main"
localgrep = "localgrep.cli:main"

[project.urls]
Homepage = "https://github.com/blackrain02/localgrep"
Repository = "https://github.com/blackrain02/localgrep"
Issues = "https://github.com/blackrain02/localgrep/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["localgrep*"]
